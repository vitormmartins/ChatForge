version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chatforge?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/chatforge
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - mysql
      - mongodb
      - rabbitmq
    networks:
      - app-network

  mysql:
    image: mysql:8.3
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: chatforge
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3
    ports:
      - "5672:5672"
    networks:
      - app-network

volumes:
  mysql-data:
  mongodb-data:

networks:
  app-network:
    driver: bridge
