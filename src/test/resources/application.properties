# Override datasource for tests to use in-memory H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate and JPA settings for H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway migrations during tests to avoid external DB connections
spring.flyway.enabled=false

# Provide dummy JWT secret for JwtUtil initialization (must be at least 32 chars)
jwt.secret-key=abcdefghijklmnopqrstuvwx1234567890

# Disable MongoDB autoconfiguration since we're not using it
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
